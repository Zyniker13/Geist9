name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: check (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # swift-nio-imap 0.5.0 needs a Swift 6.2 toolchain (its Package.swift floor).
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python for the docs check
        run: apt-get update -qq && apt-get install -y -qq python3 >/dev/null
      - run: scripts/check.sh

  macos:
    name: check (macos)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: brew install xcodegen
      - run: scripts/check.sh
