name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: check (linux)
    runs-on: ubuntu-24.04
    # M4 measured ~6 min here; the OAuth authorize flow now ends its wait
    # (`.timedOut`) instead of parking forever, which is what previously
    # ate the whole budget. 30 minutes is the honest cap again.
    timeout-minutes: 30
    # swift-nio-imap 0.5.0 needs a Swift 6.2 toolchain (its Package.swift floor).
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python for the docs check, SQLite headers for GRDB, curl and dovecot for the IMAP fixture
        # curl: GreenMail's jar download (scripts/imap-servers.sh); the
        # swift:6.2-noble base image does not ship it. dovecot-core is
        # installed so the missing-server failure names the real cause, but
        # noble's package is 2.3.21 and the fixture needs Dovecot 2.4 config
        # syntax — the Dovecot integration tests skip visibly on Linux
        # (GEIST9_SKIP_SERVERS is the sanctioned exclusion) until a 2.4
        # package is available here. macOS runs the Dovecot leg.
        run: apt-get update -qq && apt-get install -y -qq curl python3 libsqlite3-dev default-jre-headless dovecot-core >/dev/null
      - name: Cache the GreenMail jar and Stalwart tarball
        # Maven Central rate-limits fresh runner IPs (HTTP 429); a cache hit
        # makes those downloads the exception, not the rule. Keyed by the
        # versions pinned in scripts/imap-servers.sh; a miss just downloads
        # as before.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /tmp/geist9-greenmail
            /tmp/geist9-stalwart
          key: geist9-imap-servers-greenmail-2.1.3-stalwart-1.2.0
      - name: Run checks
        env:
          GEIST9_SKIP_SERVERS: dovecot
        run: scripts/check.sh

  macos:
    name: check (macos)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: brew install xcodegen dovecot
      - run: scripts/check.sh
